<script type="application/json" id="seed">{"settings": {}, "articles": [{"id": "how-i-stopped-overthinking-at-2am", "title": "How I Stopped Overthinking at 2AM (And Finally Found Peace)", "category": "Stories", "date": "2026-10-24", "summary": "A cozy, honest short story about a sleepless night, a yellow mug of tea, and three gentle questions that made overthinking feel lighter.", "image": "/assets/images/img-8212781a.jpg", "html": "\u003cp>My brain is running a marathon it never trained for.\u003c/p>\n\u003cp>It’s 2AM. My room is dark. My tea is cold. And the questions keep coming:\u003c/p>\n\u003cp class=\"q\">Why did I say that today?\u003c/p>\n\u003cp class=\"q\">Does Zoe think I was rude?\u003c/p>\n\u003cp class=\"q\">What if I fail tomorrow?\u003c/p>\n\u003cp class=\"q\">What if I never figure it out?\u003c/p>\n\u003cp>You know that voice, right? The one that gets louder when the world gets quiet.\u003c/p>\n\u003cfigure>\u003cimg alt=\"A young woman with a braided bun sits awake in bed at night, looking worried at her phone\" height=\"1100\" src=\"/assets/images/img-b4a16cbb.jpg\" width=\"1100\"/>\u003cfigcaption>2AM, and the thoughts won’t stop.\u003c/figcaption>\u003c/figure>\n\n\u003ch2>The night I made my thoughts tea\u003c/h2>\n\u003cp>For years, I thought overthinking meant something was wrong with me. That I was broken. That I had to fix my brain.\u003c/p>\n\u003cp>I tried telling myself, \u003cem>just don’t think about it.\u003c/em>\u003c/p>\n\u003cp>It never worked. You can’t tell a storm to stop raining.\u003c/p>\n\u003cp>Then one night, at 2:13 AM, I tried something different.\u003c/p>\n\u003cp>Instead of fighting my thoughts, I made them tea.\u003c/p>\n\u003cp>I know. It sounds silly. But I got up, took my yellow mug with the little pink hearts, and said out loud:\u003c/p>\n\u003cblockquote>“Okay, brain. I see you. You’re scared. Let’s talk.”\u003c/blockquote>\n\u003cp>I didn’t argue. I didn’t judge. I let my thoughts sit next to me like a friend who showed up uninvited but clearly needed company.\u003c/p>\n\u003cp>It was awkward at first. My thoughts talked over each other, and twice I reached for my phone just to escape them. But I stayed for one cup of tea. That was all I asked of myself.\u003c/p>\n\u003cfigure>\u003cimg alt=\"The same young woman sitting cross-legged on her bed with a yellow mug, writing in a notebook\" height=\"733\" src=\"/assets/images/img-35b7e989.jpg\" width=\"1100\"/>\u003cfigcaption>Paper, not phone.\u003c/figcaption>\u003c/figure>\n\u003ch2>Paper, not phone\u003c/h2>\n\u003cp>Then I wrote every thought down. On paper, not on my phone.\u003c/p>\n\u003cp class=\"q\">I’m scared I said something stupid today.\u003c/p>\n\u003cp class=\"q\">I’m scared people don’t like the real me.\u003c/p>\n\u003cp class=\"q\">I’m scared my future won’t get better.\u003c/p>\n\u003cp>On paper, they looked smaller. Less like monsters, more like worries. Just human worries.\u003c/p>\n\u003cp>I remembered something then.\u003c/p>\n\u003cp>When I was little, I woke up scared one night, and Mom came in. She didn’t say “stop worrying.” She didn’t say anything. She just sat on the edge of my bed until my breathing slowed.\u003c/p>\n\u003cp>I had forgotten that. Maybe that’s what I was trying to do with the tea. Sit on the edge of my own bed.\u003c/p>\n\u003cfigure>\u003cimg alt=\"A mother kneeling beside her sleeping daughter’s bed at night, hands folded\" height=\"733\" src=\"/assets/images/img-44883e3c.jpg\" width=\"1100\"/>\u003cfigcaption>Mom, sitting on the edge of the bed.\u003c/figcaption>\u003c/figure>\n\u003ch2>The text from Zoe\u003c/h2>\n\u003cp>The next night, my phone buzzed. It was Zoe, my best friend, the one with a pencil always tucked into her curls and a tiny gold star pinned to every cardigan.\u003c/p>\n\u003cblockquote>“Can’t sleep again. I keep thinking everyone secretly finds me annoying. Ugh. Tell me I’m being dramatic.”\u003c/blockquote>\n\u003cp>I didn’t send her an argument. I typed:\u003c/p>\n\u003cblockquote>“You’re not annoying. You’re tired. You’ve been carrying a lot. Come over, I’ll make tea.”\u003c/blockquote>\n\u003cp>I hit send. Then I sat very still.\u003c/p>\n\u003cp>I had never talked to myself like that. Not once.\u003c/p>\n\u003cfigure>\u003cimg alt=\"Two friends smiling over steaming mugs at a sunny kitchen table\" height=\"733\" src=\"/assets/images/img-4f2ccbc5.jpg\" width=\"1100\"/>\u003cfigcaption>Tea with Zoe.\u003c/figcaption>\u003c/figure>\n\u003ch2>The three questions\u003c/h2>\n\u003cp>That’s when I came up with the three questions I now ask every night. I wrote them on a card and tucked it inside my notebook:\u003c/p>\n\u003col class=\"questions\">\n\u003cli>\u003cstrong>Is this true, or is this my fear talking?\u003c/strong>\u003cem>Most of the time, it’s fear. Not fact.\u003c/em>\u003c/li>\n\u003cli>\u003cstrong>Can I do something about this right now?\u003c/strong>\u003cem>If yes, I write one tiny step for tomorrow. If no, I tell my brain: “We’ll handle this tomorrow at 10AM. Not now.”\u003c/em>\u003c/li>\n\u003cli>\u003cstrong>What would I say to Zoe if she told me this?\u003c/strong>\u003cem>I’d never call her stupid. I’d say: “You’re tired. You’re doing your best. Let’s sleep.”\u003c/em>\u003c/li>\n\u003c/ol>\n\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003ch2>The night it didn’t work\u003c/h2>\n\u003cp>I’d like to tell you it worked perfectly.\u003c/p>\n\u003cp>It didn’t.\u003c/p>\n\u003cp>Two weeks later, I sat up at 3AM with the tea, the paper, and the three questions. And nothing worked.\u003c/p>\n\u003cp>The tea had gone cold. The page stayed blank. Every answer I wrote sounded like a lie, and the clock kept glowing: 3:07, then 3:12, then 3:19.\u003c/p>\n\u003cp>I felt like a fraud. All those calm nights, and here I was, right back at the beginning. I almost threw the notebook across the room.\u003c/p>\n\u003cp>Instead, I texted Zoe: \u003cem>“It’s not working tonight.”\u003c/em>\u003c/p>\n\u003cp>She wrote back in seconds: \u003cem>“It doesn’t have to work every night. Some nights, you just sit with it. That counts too.”\u003c/em>\u003c/p>\n\u003cp>So I did. I didn’t fix anything. I didn’t answer a single question. I just sat there, next to my thoughts, the way Mom once sat next to me.\u003c/p>\n\u003cp>Somewhere near 4AM, the window turned from black to deep blue. Eventually, I slept.\u003c/p>\n\u003cp>In the morning, the mug was still on the nightstand, the tea cold, the notebook open to a blank page. I looked at it for a while and decided it could stay there.\u003c/p>\n\n\u003cfigure>\u003cimg alt=\"The young woman asleep and peaceful in bed, a mug of tea and an open notebook on the nightstand\" height=\"733\" src=\"/assets/images/img-9cccb4e4.jpg\" width=\"1100\"/>\u003cfigcaption>Finally, rest.\u003c/figcaption>\u003c/figure>\n\u003ch2>My night routine now\u003c/h2>\n\u003cul class=\"routine\">\n\u003cli>A mug of warm tea, and no phone for 30 minutes before bed\u003c/li>\n\u003cli>Paper on the nightstand: dump every thought, no filter\u003c/li>\n\u003cli>The three questions, then close the notebook and say: \u003cem>“We’re done for tonight.”\u003c/em>\u003c/li>\n\u003c/ul>\n\u003cp>It isn’t perfect. Some nights I still overthink. But now I have a place to put my thoughts, instead of carrying them in my chest.\u003c/p>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003cp>If you’re reading this at 2AM with a busy brain:\u003c/p>\n\u003cp>You’re a person with a big heart and a mind that cares a little too much.\u003c/p>\n\u003cp>Make it some tea. Write it down. Tell a friend if you can.\u003c/p>\n\u003cp>And let yourself rest.\u003c/p>\n\u003cp class=\"sign\">With love,\u003cbr/>Lina\u003c/p>\n\u003cfooter class=\"disclaimer\">\n\u003cp>Lina is a fictional character. This story is for comfort and is not medical advice or a substitute for professional care. If anxiety is affecting your daily life, please talk to a doctor or a licensed therapist.\u003c/p>\n\u003cp>Cozy Lina: honest stories for anxious hearts.\u003c/p>\n\u003c/footer>", "featured": true, "buyPrice": 1.99}, {"id": "how-i-stopped-checking-my-phone", "title": "How I Stopped Checking My Phone 10 Times Before Sleep", "category": "Stories", "date": "2026-10-25", "summary": "Lina counts every phone check with hair ties, then sends a sarcastic message to the wrong chat and finds out who is really listening.", "image": "/assets/images/phone-1.jpg", "html": "\u003cp>It’s 11:40 PM, and I’ve checked my phone nine times.\u003c/p>\n\u003cp>Nothing on it has changed.\u003c/p>\n\u003cp>I know it’s nine because I count with hair ties. One moves from my left wrist to my right every time I pick the phone up. Like a very sad abacus. I started three weeks ago, as a joke, to prove I wasn’t really checking that much.\u003c/p>\n\u003cp>The joke has not gone the way I planned.\u003c/p>\n\u003cp class=\"q\">Did they see it?\u003c/p>\n\u003cp class=\"q\">Who saw it?\u003c/p>\n\u003cp class=\"q\">What if Ms. Alvarez saw it?\u003c/p>\n\u003cfigure>\u003cimg alt=\"A young woman with a braided bun sits cross-legged on her bed at night, her phone glowing, hair ties lined up on her wrist\" src=\"/assets/images/phone-1.jpg\" width=\"1100\" height=\"733\">\u003cfigcaption>Nine hair ties, one glowing screen.\u003c/figcaption>\u003c/figure>\n\n\u003ch2>The message that wasn’t for them\u003c/h2>\n\u003cp>Here’s what I did. Our history group chat has five students and, since last Thursday, Ms. Alvarez, who was added “to see our progress.”\u003c/p>\n\u003cp>At 8:15, Marcus asked who was making the timeline slides. My thumbs answered before my brain could stop them:\u003c/p>\n\u003cblockquote>“Sure, I’ll just do all of it. Again.”\u003c/blockquote>\n\u003cp>It was meant for Zoe, in our other thread, the one where we complain about everything. I opened the wrong one.\u003c/p>\n\u003cp>I deleted it in twenty seconds. That sounds like a rescue until you see what’s left behind: a gray line that says \u003cem>This message was deleted.\u003c/em> It’s like erasing a sentence from a chalkboard and leaving a perfectly clean rectangle. Everyone knows something was there.\u003c/p>\n\n\u003ch2>Check number ten\u003c/h2>\n\u003cp>At 11:52, I checked again. “Read by 4.”\u003c/p>\n\u003cp>No replies. Four people had seen the gray rectangle, four people had said nothing, and my brain turned that silence into a full trial. Jury. Judge. A very disappointed bailiff.\u003c/p>\n\u003cp>So I did the responsible thing. I put the phone on the dresser, all the way across the room.\u003c/p>\n\u003cp>At 12:10, I walked over there “to check the time.”\u003c/p>\n\u003cp>The time was on my phone. That’s the whole problem. My left wrist was bare by then, so I counted the rest on my fingers, which isn’t a system. It’s a confession.\u003c/p>\n\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003ch2>The question the screen couldn’t answer\u003c/h2>\n\u003cp>Around 12:30, lying in the dark with the phone glowing across the room like a tiny, judgmental nightlight, I noticed something.\u003c/p>\n\u003cp>The screen could tell me who had \u003cem>read\u003c/em> the message. It could never tell me what any of them \u003cem>thought\u003c/em>.\u003c/p>\n\u003cp>For that, I’d have to ask an actual person. Terrible idea. Also the only one on offer.\u003c/p>\n\u003cp>I didn’t text Zoe. She’d been up at dawn all week, and I wasn’t going to drop one more thing into her phone at midnight. I’d say it out loud.\u003c/p>\n\u003cp>Then I fell asleep the way a phone dies at one percent: no warning, still holding on.\u003c/p>\n\n\u003ch2>Eucalyptus and a half-eaten bagel\u003c/h2>\n\u003cp>Zoe showed up at the bus stop with a pencil tucked in her curls, a tiny gold star pinned to her cardigan, and a smell of eucalyptus and wet cardboard. She’s been working mornings at her aunt’s flower shop since the holiday rush, and she carries it around like a very green rumor.\u003c/p>\n\u003cp>“I did something dumb,” I said, before I could rehearse it. I told her everything: the message, the wrong thread, the gray rectangle.\u003c/p>\n\u003cp>Zoe stopped chewing. “I muted that chat on Sunday. I haven’t read a single thing.”\u003c/p>\n\u003cp>Relief started climbing up my spine. Then she frowned.\u003c/p>\n\u003cp>“Wait. ‘Again’?”\u003c/p>\n\u003cp>“It was a joke.”\u003c/p>\n\u003cp>“About me?”\u003c/p>\n\u003cp>“About the slides. About… okay, a little about you.”\u003c/p>\n\u003cp>“I did the maps for the last project, Lina. By myself. At my kitchen table.” She said it flatly, not loud, and that was worse. “And if you were drowning, you could’ve just asked me. I’d have said yes.”\u003c/p>\n\u003cfigure>\u003cimg alt=\"Two friends stand at a bus stop on a gray morning, one holding half a bagel while the other offers a blue hair tie from her wrist\" src=\"/assets/images/phone-2.jpg\" width=\"1100\" height=\"733\">\u003cfigcaption>Eucalyptus, a half-eaten bagel, and the truth.\u003c/figcaption>\u003c/figure>\n\u003cp>“I didn’t want to add to your pile,” I said. “You’ve been so tired.”\u003c/p>\n\u003cp>“Deciding I’m too busy isn’t the same as asking me.” She let that sit for a second, then sighed. “But thank you for telling me. I’m still a little mad.”\u003c/p>\n\u003cp>“That’s fair.”\u003c/p>\n\u003cp>“It’s very fair.” Her curls were sliding out of their clip. “Mine snapped in the flower cooler. Can I borrow one?”\u003c/p>\n\u003cp>She was already tugging a blue hair tie off my right wrist. She twisted her curls into a puff and looked at the bare spot on my arm. “Does this mess up your count?”\u003c/p>\n\u003cp>“Honestly? I think it helps.”\u003c/p>\n\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003ch2>What the chat said (and didn’t)\u003c/h2>\n\u003cp>Before first period, I wrote to the whole group: \u003cem>That deleted message was sarcasm meant for someone else, and it wasn’t fair to any of you. I’ll make the timeline slides if someone can take sources.\u003c/em>\u003c/p>\n\u003cp>My thumb hovered over Send for an embarrassingly long time.\u003c/p>\n\u003cp>Marcus replied in under a minute with a thumbs-up and “tbh I thought it was funny.” Priya sent a heart. Tessa said nothing. Ms. Alvarez said nothing either, but at the end of class she paused at my desk and said, “Looking forward to the timeline,” in a voice so ordinary I almost didn’t know what to do with it.\u003c/p>\n\u003cp>Tessa stayed quiet all day. I don’t know what that silence meant. Maybe nothing. Maybe she just doesn’t answer group chats.\u003c/p>\n\u003cp>By fifth period, I was doing math. Tessa had seen my apology before first period. It was now almost two. That was nearly six hours of silence, which my brain converted, with great confidence, into a verdict.\u003c/p>\n\u003cp>I stared at the back of her head for most of the lesson. She was drawing a lopsided cactus in her margin, and at one point she laughed at something Marcus whispered, a small, ordinary laugh that had nothing to do with me.\u003c/p>\n\u003cp>Or maybe it did. That was the hard part. A person can laugh and still be quietly upset, or laugh and be completely fine, and no amount of staring would tell me which. Only asking would. I wasn’t brave enough for that today.\u003c/p>\n\u003cp>So I wrote \u003cem>talk to Tessa?\u003c/em> on the back of my hand, in pen. It looked like a very small, very honest reminder.\u003c/p>\n\u003cp>At lunch, I checked once, moved one hair tie, and put the phone in my bag. The afternoon went on without a verdict.\u003c/p>\n\u003cfigure>\u003cimg alt=\"The same young woman in her lamplit bedroom at night, three hair ties on her wrist and a phone charging on the dresser behind her\" src=\"/assets/images/phone-3.jpg\" width=\"1100\" height=\"733\">\u003cfigcaption>Three, not ten.\u003c/figcaption>\u003c/figure>\n\u003cp>That night, I checked three times. I’m not going to pretend it was zero.\u003c/p>\n\u003cp>Three hair ties on my right wrist. One in Zoe’s curls. And my phone charging in the dark, doing nothing at all.\u003c/p>\n\u003cp class=\"sign\">With love,\u003cbr>Lina\u003c/p>\n\n\u003cfooter class=\"disclaimer\">\n\u003cp>Lina is a fictional character. This story is for comfort and is not medical advice or a substitute for professional care. If anxiety is affecting your daily life, please talk to a doctor or a licensed therapist.\u003c/p>\n\u003cp>Cozy Lina: honest stories for anxious hearts.\u003c/p>\n\u003c/footer>", "featured": false}, {"id": "the-night-i-thought-everyone-hated-me", "title": "The Night I Thought Everyone Hated Me (And They Didn’t)", "category": "Stories", "date": "2026-10-25", "summary": "Lina overhears her name through a half-open door and builds a full case against herself overnight. The next day, she asks.", "image": "/assets/images/night-1.jpg", "html": "\u003cp>The sentence was only seven words long, and by midnight I had turned it into a documentary.\u003c/p>\n\u003cp>Here is what happened. On Wednesday, after the winter fair meeting in Room 114, I realized my scarf was still hanging on the back of my chair, so I went back for it. The door was open about three inches, the kind of gap that lets sound out but doesn’t let people in. And through it, I heard Priya say, “I can’t believe she did that today.”\u003c/p>\n\u003cp>Then laughter. Not one person. Several.\u003c/p>\n\u003cfigure>\u003cimg alt=\"Lina stands in a school hallway at dusk, one hand raised toward a classroom door that is open a few inches, with warm light spilling out.\" height=\"733\" src=\"/assets/images/night-1.jpg\" width=\"1100\">\u003cfigcaption>Three inches of light, seven words of sound.\u003c/figcaption>\u003c/figure>\n\u003cp>I stood in the hallway with my hand halfway to the door, and I did what any brave, mature person would do. I turned around and left the scarf.\u003c/p>\n\u003cp>It was twenty-eight degrees outside. I walked the whole way home with my hands pulled up inside my sleeves, composing a speech to nobody, and every streetlight I passed felt like it was shining on a person who had Done Something.\u003c/p>\n\u003ch2>The case against me\u003c/h2>\n\u003cp>Okay, so you need the background. About an hour earlier, I had knocked a full jar of silver glitter onto the donation box. All of it. The box looked like it had been dipped in a disco. The room went completely silent, and I said, in a voice I didn’t recognize, “Well. The fair is now officially sparkly.” Nobody laughed. Dev raised his eyebrows. Priya looked at her notebook. Someone coughed. We moved on to hot chocolate.\u003c/p>\n\u003cp>So when I heard that sentence through the door, my brain did not ask what it meant. My brain opened a courtroom.\u003c/p>\n\u003cp>That night, I lay in bed as both the prosecutor and the defendant, and the prosecutor was winning. Exhibit A: Dev’s eyebrows. Exhibit B: Priya not looking up. Exhibit C: nobody asked me to stay and stack chairs, which, in committee terms, is basically a public shunning.\u003c/p>\n\u003cp>Around one in the morning, I noticed something strange about my evidence. Every piece of it was a look, a pause, or something that had not happened. Nobody had said anything cruel to me. My entire case rested on eyebrows and silence.\u003c/p>\n\u003cp>I also played the sentence back about forty times, trying different tones, like a detective with a very small tape recorder. \u003cem>I can’t believe she did that today\u003c/em>, said with admiration. \u003cem>I can’t believe she did that today\u003c/em>, said with a sigh. \u003cem>I can’t believe she did that today\u003c/em>, said by someone handing out a very tiny trophy. All forty versions were possible. That is the annoying thing about seven words: they don’t come with a tone, and my brain, handed a blank, always fills it in with the cruelest option on the menu.\u003c/p>\n\u003cp class=\"q\">That should have been the end of the trial. It was not. The prosecutor simply argued that silence was the cleverest kind of cruelty. (She is very good.)\u003c/p>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003ch2>Zoe’s hands\u003c/h2>\n\u003cp>In the morning, I found Zoe at her locker with my opening statement fully prepared. I got exactly five words in.\u003c/p>\n\u003cblockquote>“Zoe, I think the whole committee—”\u003c/blockquote>\n\u003cp>“Can we do this later?” She wasn’t looking at me. She was holding her audition sheet, and it was shaking, just slightly, like a leaf in a very polite wind. “I’m sorry. I know you’re having a thing. But my audition is at 3:15, and I think I might throw up on the piano.”\u003c/p>\n\u003cp>I had a speech about the committee. It was a good speech. I folded it up and put it in my pocket.\u003c/p>\n\u003cp>“Okay,” I said. “Give me your hands.”\u003c/p>\n\u003cp>She gave me her hands. They were freezing. We stood there next to locker 212 while a freshman struggled with the one beside us, and I discovered that it is very hard to hold on to a full-blown conspiracy theory while someone’s fingers are cold.\u003c/p>\n\u003cp>“You’re going to be great,” I said. It wasn’t advice. It was just the only true thing I had on me.\u003c/p>\n\u003cfigure>\u003cimg alt=\"Lina holds both hands of her nervous friend Zoe, who clutches a crumpled audition sheet, beside the lockers.\" height=\"733\" src=\"/assets/images/night-2.jpg\" width=\"1100\">\u003cfigcaption>Cold fingers, warm hands.\u003c/figcaption>\u003c/figure>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003ch2>Seven words\u003c/h2>\n\u003cp>At lunch, Priya was at the end of a cafeteria table, peeling a clementine. My knees felt like they belonged to someone else. But somewhere between the locker and the lunch line, I had noticed something. Zoe had said exactly what she needed, out loud, with her hands shaking, and it had worked better than any speech I owned. I could try one honest sentence.\u003c/p>\n\u003cp>“Hi,” I said. “So, I went back for my scarf last night, and the door was open, and I heard you say my name. I didn’t hear the rest. I just took the worst version home.”\u003c/p>\n\u003cp>Priya stopped peeling. Her face went through confusion, then horror, then something close to a groan.\u003c/p>\n\u003cp>“Oh no. Lina. We were laughing about the \u003cem>glitter\u003c/em>.”\u003c/p>\n\u003cp>“The glitter.”\u003c/p>\n\u003cp>“Dev said the donation box looked like it had been to a rave, and I said I couldn’t believe you did that today, because you just stood there covered in sparkle and announced the fair was officially sparkly. It was the best thing anyone has said in that room all year. We were trying so hard not to laugh in front of you, because you looked mortified. Then you left, and we completely lost it.”\u003c/p>\n\u003cp>I thought about that for a second. “That might be the least helpful kindness in history.”\u003c/p>\n\u003cp>“Yeah,” Priya said, wincing. “We’re going to work on it.”\u003c/p>\n\u003cp>It wasn’t a perfect ending. Dev still couldn’t explain his eyebrows, and some mysteries stay mysteries. But my scarf was waiting on the back of my chair in Room 114, exactly where I had left it, and a small, careful part of my chest unclenched.\u003c/p>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003cp>At 3:15, I sat on the floor outside the music room with the scarf in my lap, listening through a door that was open about three inches. A piano started. It hit one wrong note, stopped, and then kept going.\u003c/p>\n\u003cp>This time, I stayed for the whole song.\u003c/p>\n\u003cfigure>\u003cimg alt=\"Lina sits on the hallway floor with a knitted scarf in her lap, smiling as she listens to piano music through a slightly open door.\" height=\"733\" src=\"/assets/images/night-3.jpg\" width=\"1100\">\u003cfigcaption>A wrong note, and then the rest of the song.\u003c/figcaption>\u003c/figure>\n\u003cp>When I looked down, there was still a little silver glitter stuck to the pink heart on my sweater, catching the light from the hallway window. I didn’t brush it off.\u003c/p>\n\u003cp class=\"sign\">With love,\u003cbr>Lina\u003c/p>\n\u003cfooter class=\"disclaimer\">\n\u003cp>Lina is a fictional character. This story is for comfort and is not medical advice or a substitute for professional care. If anxiety is affecting your daily life, please talk to a doctor or a licensed therapist.\u003c/p>\n\u003cp>Cozy Lina: honest stories for anxious hearts.\u003c/p>\n\u003c/footer>", "featured": false}, {"id": "why-my-brain-gets-loud-at-night", "title": "Why My Brain Gets Loud at Night (and Quiet in the Morning)", "category": "Stories", "date": "2026-10-25", "summary": "Awake at 4 a.m., Lina knocks on the neighborhood bakery door and ends up shaping sixty rolls for a baker with loud nights of his own.", "image": "", "html": "\u003cp>At 4:10 in the morning, I was standing on the back steps of Haddad’s Bakery in pajama pants, my school coat and one mismatched sock, holding a library book as an excuse.\u003c/p>\n\u003cp>The book was due Thursday. This was not a library emergency. But the bakery light had been on every night that week, and I had been awake to see it every night that week, and at some point around 3:50 my brain had said, very calmly, \u003cem>go ask the person who is awake why he is awake.\u003c/em>\u003c/p>\n\u003cp>I had already tried the usual things. I counted backward from a hundred. I recited the nine slides in my head, and I made it to slide four before the dog showed up. I rearranged my pillow into four separate positions, none of which was a position a human being could sleep in.\u003c/p>\n\u003ch2>Two of me\u003c/h2>\n\u003cp>Okay, so here is my problem. At 11 p.m., my brain turns its volume all the way up. On Friday I had a river-cleanup presentation (four minutes, nine slides, one very large chart), and every night that week my brain had played it like a movie, with new disasters added each time. The projector dies. My voice cracks. A dog walks in.\u003c/p>\n\u003cp>Then, at 7 a.m., the volume drops to nothing. Morning me eats toast and thinks, \u003cem>What presentation? It’s four minutes.\u003c/em> Morning me has never once believed night me. That is the part that makes me furious. We live in the same body, and we don’t even talk.\u003c/p>\n\u003cp>The back door opened. Mr. Haddad was a large man with flour up to both elbows and a pencil behind his ear, and he looked at me, then at the book, then at the clock over the oven.\u003c/p>\n\u003cp>“You’re Lina from number nine,” he said. “It’s four o’clock.”\u003c/p>\n\u003cp>“I know. I brought a book.”\u003c/p>\n\u003cp>“Why?”\u003c/p>\n\u003cp>“I honestly don’t know.”\u003c/p>\n\u003cp>He considered this. Then he said, “Can you shape rolls?”\u003c/p>\n\u003cp>“I can… learn?”\u003c/p>\n\u003cp>“Good. Danny didn’t come in, and I have sixty to finish before six.” He held the door wider. “I’m not being kind. I’m behind. I need hands.”\u003c/p>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003ch2>Sixty rolls\u003c/h2>\n\u003cp>The bakery was the warmest place I had ever been at that hour. A radio played something low and crackly, and the whole room smelled like the inside of a loaf. Steel racks lined the walls like bookshelves for bread. Mr. Haddad showed me once: cut, round, tuck. Cut, round, tuck. My first ten rolls looked like small, sad potatoes.\u003c/p>\n\u003cp>“Again,” said Mr. Haddad, which turned out to be the only feedback he gave. Not “good,” not “bad.” Just “again,” like a very patient metronome.\u003c/p>\n\u003cp>I had assumed the loudness would stay outside the door. It did not.\u003c/p>\n\u003cp>“The projector dies,” my brain announced, right over the hum of the mixer. “Your voice cracks. A dog.”\u003c/p>\n\u003cp>“Your face is doing something,” Mr. Haddad said, not looking up.\u003c/p>\n\u003cp>“My brain is loud.”\u003c/p>\n\u003cp>He nodded, like I had told him it was drizzling. “Mine too. Around two. It doesn’t come with an off switch.”\u003c/p>\n\u003cp>I rounded a roll. “I have a theory,” I said. “I think night me is the real me, and morning me is a liar who just feels better because the sun is out.”\u003c/p>\n\u003cp>He laughed so hard he had to set down his tray. “Which one told you that?”\u003c/p>\n\u003cp>“The night one.”\u003c/p>\n\u003cp>“Then I would say,” said Mr. Haddad, wiping his eyes with a floury wrist, “that the night one is biased.”\u003c/p>\n\u003cp>I waited for the rest of the answer. There wasn’t one. When I asked him why the nights were louder, he shrugged and said, “Might be the quiet. Might be tired. Might be both. I just know I’d rather be up with something to do with my hands.” He said it like a fact about weather, not like advice, and I decided not to turn it into advice.\u003c/p>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003cp>I wish I could tell you the volume dropped to zero. It didn’t. It rose and fell like the radio. But somewhere around roll thirty, I noticed something small: I was counting rolls instead of dogs.\u003c/p>\n\u003cp>That was the entire miracle. One tray, maybe two. It was not a cure or a trick, just a tray of rolls and, for the length of it, a dog who stayed out of the room. At 5:20 the projector came back for a full minute, and I let it, and kept tucking.\u003c/p>\n\u003cp>At 5:30, the last tray had to rise, and nothing in the world can make dough hurry. Mr. Haddad poured himself a coffee and made me a mug of hot water with honey, because, he said, it was the middle of the night and I was a minor. We sat on two flour sacks and watched the trays do nothing at all. It was the first time all week I had watched something do nothing without feeling responsible for it.\u003c/p>\n\u003cp>By 5:50, forty-one of the rolls on the rack were mine. Thirteen of them looked like actual rolls. Mr. Haddad slid a paper bag across the counter, still warm enough that I could feel it through my coat.\u003c/p>\n\u003cp>“Payment,” he said.\u003c/p>\n\u003cp>“For the presentation?”\u003c/p>\n\u003cp>“For the labor. The presentation you’re on your own for.”\u003c/p>\n\u003cp aria-hidden=\"true\" class=\"dots\">· · ·\u003c/p>\n\u003cp>Outside, the sky had gone the color of dishwater, the good kind. I walked home slowly with the bag against my ribs and watched the streetlights switch off one by one down the block, like someone going through a house, making sure everything was fine.\u003c/p>\n\u003cp>Friday still had a projector in it. It might still have a dog. I had no answer about my brain and its two schedules, only a bakery, a baker with a loud night of his own, and a bag of bread.\u003c/p>\n\u003cp>I sat down on the curb in front of number nine and ate the first roll I had ever made. It was lopsided. It was still warm. I would not have believed it at 11 p.m., but it was one of the best things I had ever eaten.\u003c/p>\n\u003cp class=\"sign\">With love,\u003cbr>Lina\u003c/p>\n\u003cfooter class=\"disclaimer\">\n\u003cp>Lina is a fictional character. This story is for comfort and is not medical advice or a substitute for professional care. If anxiety is affecting your daily life, please talk to a doctor or a licensed therapist.\u003c/p>\n\u003cp>Cozy Lina: honest stories for anxious hearts.\u003c/p>\n\u003c/footer>", "featured": false}]}</script>

/* ---------- article form ---------- */
var coverData="";
function shrinkDataUrl(src,max,qual){return new Promise(function(res){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",qual))};im.onerror=function(){res(src)};im.src=src})}
async function optimizeHtml(html){
 var re=/data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+\/=]+/g,m=html.match(re)||[],changed=0,seen={};
 for(var i=0;i<m.length;i++){var u=m[i];if(seen[u]!==undefined||u.length<120000)continue;var n=await shrinkDataUrl(u,900,0.75);seen[u]=n;if(n.length<u.length)changed++}
 return{html:html.replace(re,function(u){return seen[u]!==undefined&&seen[u].length<u.length?seen[u]:u}),changed:changed}}
function openForm(p){

 $("#fn").value=p?p.title:"";$("#fc").value=p?p.category:"";$("#fs").value=p?p.summary:"";$("#fdt").value=p?p.date:today();
 $("#fcl").value=p&&p.image&&p.image.indexOf("data:")!==0?p.image:"";coverData=p&&p.image&&p.image.indexOf("data:")===0?p.image:"";drawCover();
 $("#fb").value=p?p.html:"";$("#ff").checked=!!(p&&p.featured);$("#fbu").value=p?p.buyUrl||"":"";$("#fbp").value=p?(p.buyPrice||""):"1.99";
 d.dataset.id=p?p.id:"";d.showModal();$("#fn").focus()}
function drawCover(){$("#cvp").innerHTML=coverData?'<img src="'+esc(coverData)+'" alt="" width="96" height="60" style="object-fit:cover;border-radius:8px">':''}
function readHtmlFile(txt){
 var doc=new DOMParser().parseFromString(txt,"text/html"),art=doc.querySelector("article")||doc.body;art=art.cloneNode(true);
 var tt=((doc.querySelector("title")||{}).textContent||"").trim(),md=doc.querySelector('meta[name="description"]'),desc=md?(md.getAttribute("content")||""):"";
 var hf=art.querySelector("figure.hero"),hi=hf?hf.querySelector("img"):null,cover=hi?hi.getAttribute("src"):"";
 if(hf)hf.remove();
 art.querySelectorAll("header,.ad-slot,script,style,link,meta,iframe,form,nav,noscript").forEach(function(x){x.remove()});
 var h1=art.querySelector("h1"),h1t=h1?h1.textContent.trim():"";if(h1)h1.remove();
 if(!cover){var im=art.querySelector("img");cover=im?(im.getAttribute("src")||""):""}
 if(!desc){var p=art.querySelector("p");desc=p?p.textContent.trim().replace(/\s+/g," ").slice(0,160):""}
 return{title:tt||h1t,summary:desc,cover:cover,html:art.innerHTML.trim()}}
var filling=false;
async function autoFill(){
 var raw=$("#fb").value;if(filling||!/<\s*(html|body|head|article|h1)\b|<title/i.test(raw))return;filling=true;
 try{var r=readHtmlFile(raw);if(!r.html)return;
  if(r.title&&!$("#fn").value.trim())$("#fn").value=r.title.slice(0,120);
  if(r.summary&&!$("#fs").value.trim())$("#fs").value=r.summary.slice(0,300);
  if(r.cover&&safeImg(r.cover)&&!coverData&&!$("#fcl").value.trim()){if(r.cover.indexOf("data:")===0){coverData=await shrinkDataUrl(r.cover,900,0.8);drawCover()}else $("#fcl").value=r.cover}
  var o=await optimizeHtml(r.html);$("#fb").value=o.html}catch(x){}finally{filling=false}}

 $("#fx").onclick=function(){$("#dlg").close()};

 $("#fcu").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=async function(){coverData=await shrinkDataUrl(r.result,900,0.8);drawCover()};r.readAsDataURL(f);e.target.value=""};
 $("#fff").onchange=function(e){var f=e.target.files[0];e.target.value="";if(!f)return;f.text().then(async function(txt){try{var r=readHtmlFile(txt);if(!r.html)throw 0;if(r.title)$("#fn").value=r.title.slice(0,120);if(r.summary&&!$("#fs").value)$("#fs").value=r.summary.slice(0,300);if(r.cover&&safeImg(r.cover)){if(r.cover.indexOf("data:")===0){coverData=await shrinkDataUrl(r.cover,900,0.8);drawCover()}else $("#fcl").value=r.cover}
  var o=await optimizeHtml(r.html);$("#fb").value=o.html;toast(t("optDone"))}catch(x){$("#ferr").textContent=t("badHtml")}})};
 $("#fopt").onclick=async function(){var er=$("#ferr");er.textContent=t("optWork");try{var o=await optimizeHtml($("#fb").value);$("#fb").value=o.html;er.textContent=o.changed?t("optDone"):t("optNone")}catch(x){er.textContent=""}};

  var o={id:id||slug(title)+"-"+Date.now().toString(36),title:title,category:$("#fc").value.trim(),date:$("#fdt").value||today(),summary:$("#fs").value.trim(),image:img,html:html,featured:$("#ff").checked,buyUrl:bu,buyPrice:Number($("#fbp").value)||0};
  var old=articles.slice();
  if($("#ff").checked)articles=articles.map(function(p){p.featured=false;return p});
  if(id)articles=articles.map(function(p){return p.id===id?normArticle(o):p});else articles.push(normArticle(o));
  sortArticles();if(!persist()){articles=old;return}$("#dlg").close();toast(t("saved"));render()}}
